      - {item: "H1 marked {: .no_toc }", passed: true, note: ""}
      - {item: "Lead paragraph marked {: .fs-6 .fw-300 }", passed: true, note: "Lead carries the no-replication caveat and uses 'interpret'"}
      - {item: "TOC block copied from existing pages", passed: true, note: "Same syntax as dora-metrics.md"}
      - {item: "Reference-style links collected at bottom", passed: true, note: "All links are reference-style; definitions at end of file"}
      - {item: "Internal links use {% link %}", passed: true, note: "dora-metrics.md and how-to/facilitation-guide.md"}
      - {item: "Metric definitions quoted verbatim and credited to DORA", passed: true, note: "Five definitions and two group definitions from the dora.dev raw source (research Finding 4.1)"}
      - {item: "Book and reports cited by chapter/year/page", passed: true, note: "Accelerate by chapter; reports by year and page"}
      - {item: "Validation file kept out of site/", passed: true, note: "This file is in docs/research/"}
    content_rules_from_research_review:
      - {item: "No-trade-off stated as DORA program finding, endorsed in Fowler's foreword, with no replication outside DORA; caveat in or near lead", passed: true, note: "Lead paragraph and Overview; 'Status of the claim' repeats it"}
      - {item: "Phrases 'independently endorsed' and 'independently replicated' absent", passed: true, note: "Grep: no occurrence of 'independent' in the page"}
      - {item: "Every statistic has a report year (and page for 2024/2025 PDFs)", passed: true, note: "2014, 2016, 2017 (book, 2014-2017 data), 2022, 2023, 2024 (pp. 11, 13, 14, 15, 39, 40), 2025 (pp. 4, 16, 35)"}
      - {item: "No 2014 market-capitalisation claim", passed: true, note: "Omitted"}
      - {item: "No causal wording; mechanisms framed as 'the authors propose'/'the book argues'", passed: true, note: "Checked; the only 'drive' is the book's quote"}
      - {item: "A6 not used", passed: true, note: "Omitted"}
      - {item: "Finster (P1) not in quotation marks", passed: true, note: "One paraphrase, attributed to the IT Revolution product page; no quoted fragments"}
      - {item: "2022 '69%' only with year 2022", passed: true, note: "'The Medium cluster held 69% of respondents' under the 2022 bullet, with 2022 report announcement link"}
      - {item: "2025 profiles: names and shares only for 'High impact, low cadence' and 'Pragmatic performers'", passed: true, note: "No profile is named on the page in revision 1. The 2025 row gives only the count of seven profiles and DORA's 'interpretation of the data' wording (p. 16)"}
      - {item: "No 'high system stability' for Foundational challenges", passed: true, note: "Profile not described"}
      - {item: "2024 Medium-vs-High presented as DORA explains it, not as divergence; 'stability' vs 'Instability' naming noted", passed: true, note: "p. 14 explanation; naming note in framework section"}
      - {item: "Failed Deployment Recovery Time in Throughput: description only, no statistical claim", passed: true, note: "'DORA's 2024 report describes the throughput factor as ... (p. 12)' plus 'not a statistical test'"}
      - {item: "Pitfalls note the book vs DORA conflict on targets and benchmarking", passed: true, note: "Conflict paragraph under Common pitfalls; DORA pitfalls paraphrased, not quoted (revision 1)"}
      - {item: "p. 39 hedge restored in full", passed: true, note: "'emerging evidence suggests these factors operate with sufficient independence to warrant separate consideration' (DORA 2024 report, p. 39)"}
      - {item: "Uncited sentence on same-term definitions removed", passed: true, note: "Deleted in revision 1"}

