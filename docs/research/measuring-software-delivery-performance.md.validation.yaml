      summary: "First rewrite. Verdict needs-revision (readability). Coordinator measured 3,012 words, 260 sentences, Flesch 50.6 (heuristic syllables)."
    - revision: 1
      summary: >
        Coordinator revision request applied in place. Cut exceptions list (2016 and 2017 merged; 2014 compressed; 2023 Elite return folded into the 2022 bullet; platform-engineering figures dropped). Block quote reduced to the inventory sentence. Velocity and utilization bullets reduced to one sentence each. Pitfalls trimmed (Huber, Fear, individuals as one line). Fowler paragraph: confirmation-bias and "more confidence" clauses removed. Older-terms table replaced with one sentence. Overview now points to the DORA Metrics page and to "The DORA framework today". Uncited sentence on same-term definitions deleted. p. 39 quote restored with its full hedge. Pitfall phrases "setting metrics as a goal" and "making disparate comparisons" unquoted and attributed to DORA guidance. Lead uses "interpret". Capabilities cited as 2014-2017 data (Ch 1). Maturity-model sentence restated without quotes. Older material "Stability group" sentence added. Long sentences split across the page.
    - revision: 2
      summary: "Coordinator applied doc review iteration 2 notes: 'several hundred people' restored, five plain-word swaps. User approved readability exception (Flesch 50 or above, ASL 12 or under). Verdict approved."
  tooling_note: >
    No shell or readability tooling was available to the reviewer in this run. Spelling was checked by reading and by
    grep. Flesch and word count below are the reviewer's hand estimates. The coordinator's heuristic script
    measurement for revision 0 is recorded separately. Link targets were checked for syntax and label pairing
    by grep. URLs were not fetched live in this run.

  classification:
    type: explanation
    confidence: high
    signals:
      positive:
        - "Opens with 'why': 'Why software delivery is hard to measure', 'Why not lines of code, velocity or utilization', 'Why it matters'"
        - "Reasoning and alternatives: lines of code, velocity and utilization are weighed against two criteria"
        - "Background framing for Participants: 'This page is background reading for Participants in this Learning Hour'"
        - "Trade-offs and caveats discussed: correlation vs cause, limits of survey method, sponsorship, Fowler's foreword"
        - "History and rationale: four measures to five, dated exceptions 2014-2025, mechanisms as proposals"
      red_flags_checked:
        - "Numbered procedure: none. The only numbered list is the two criteria for a good measure (principles, not steps)"
        - "Imperative task steps: none. Pitfall advice is attributed to DORA guidance"
        - "Tutorial cues ('Getting started', 'You should see'): none"
        - "How-to cues ('Before you start', 'Done:'): none"
    jtbd: "Understand the design rationale for DORA's measures so that I can extend or critique them (canonical Explanation JTBD). Single JTBD; no second JTBD in tension."
    cross_links:
      - "Links to Facilitation Guide as the place for how the Learning Hour uses the measures (how-to link, not steps)"
      - "Links to the DORA Metrics page for the five metrics, so per-metric definitions are not duplicated"

  checklist_results:
