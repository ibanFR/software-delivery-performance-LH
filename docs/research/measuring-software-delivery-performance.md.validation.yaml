    - "Common Pitfalls: DORA's seven, then maturity model, measuring individuals, AI output. Each entry is one to three sentences and cross-references the good-measure properties instead of restating them."
    - "Further reading: 12 one-line items (10 external, plus internal [DORA Metrics] and [Facilitation Guide]), written as '- [Label][]: text'. Lee flagged as independent critique."

