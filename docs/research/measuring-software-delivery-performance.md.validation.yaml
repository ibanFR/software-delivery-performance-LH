      - {item: "Addresses 'why' not 'what'", passed: true, note: "Sections are organized around reasons"}
      - {item: "Provides context and reasoning", passed: true, note: "Lean split, Accelerate method, cluster analysis, sampling limits"}
      - {item: "Discusses alternatives", passed: true, note: "Output measures (lines of code, velocity, utilization); survey vs system data; capability vs maturity models; book vs DORA on targets"}
      - {item: "No task steps", passed: true, note: "No procedures. Pitfall advice is attributed to DORA guidance"}
      - {item: "Builds conceptual model", passed: true, note: "Throughput/Instability grouping, correlation vs cause, dated exceptions"}
    structure_and_conventions:
